; Keeping the pytest rootdir at tests/ is deliberate.
;
; The repository root is itself a Python package (it has an __init__.py, as
; ComfyUI custom node packs do). If pytest's rootdir were the repository root,
; pytest would build a Package node for it and import that __init__.py during
; test setup -- which pulls in the entire node pack and therefore a full
; ComfyUI installation. Anchoring the rootdir here keeps the suite runnable
; with nothing but torch, kornia and pytest installed.
[pytest]
; --import-mode is a command-line flag, not an ini key; setting it as `import-mode`
; here was silently ignored (pytest warned about an unknown config option).
addopts = -q --import-mode=importlib
consider_namespace_packages = true
